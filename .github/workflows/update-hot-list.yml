name: 每日内容清单

on:
  schedule:
    # 22:30 UTC = 北京时间次日 06:30，避开整点
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hot-list
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 读取仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 装门禁依赖
        run: |
          python -m pip install -q pyyaml
          git clone -q --depth 1 https://github.com/ilang-ai/iml-protocol "$RUNNER_TEMP/iml-protocol"
      - name: 拉热点 聚类 写清单 管源
        env:
          PYTHONUTF8: '1'
        run: python scripts/update_hot_list.py
      - name: 提交清单
        env:
          PYTHONUTF8: '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "清单没变化"; else
            git commit -q -m "hot: $(date -u +%Y-%m-%d) 内容清单 [skip ci]"
            git push -q origin HEAD
          fi
      - name: 自动发版
        env:
          PYTHONUTF8: '1'
          GH_TOKEN: ${{ github.token }}
          IML_REPO: ${{ runner.temp }}/iml-protocol
        run: python scripts/release.py
